<!doctype html>
<html>
  <head>
    <title>Your name - Ghost Name Picker</title>
    <link
      type="text/css"
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h1>Your name</h1>

    {% if error %}
    <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('enter_name') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
      <p>
        <label for="first_name">First name</label>
        <input
          id="first_name"
          name="first_name"
          maxlength="100"
          value="{{ first_name }}"
        />
      </p>
      <p>
        <label for="last_name">Last name</label>
        <input
          id="last_name"
          name="last_name"
          maxlength="100"
          value="{{ last_name }}"
        />
      </p>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
