<!doctype html>
<html>
  <head>
    <title>Your ghost names - Ghost Name Picker</title>
    <link
      type="text/css"
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h1>Your ghost names</h1>

    {% if error %}
    <p role="alert">{{ error }}</p>
    {% endif %}

    {% if options %}
    <form method="post" action="{{ url_for('ghost_name_results') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
      {% for id, label in options %}
      <p>
        <input
          type="radio"
          id="ghost_name_{{ loop.index }}"
          name="ghost_name"
          value="{{ id }}"
        />
        <label for="ghost_name_{{ loop.index }}">{{ label }}</label>
      </p>
      {% endfor %}
      <button type="submit">Submit</button>
    </form>
    {% else %}
    <p>Sorry, all ghost names have been taken.</p>
    {% endif %}

    <p><a href="{{ url_for('root') }}">Back to overview</a></p>
  </body>
</html>
